name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

# The release job uploads an asset to the published release.
permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwayland-dev wayland-protocols \
            libcairo2-dev python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Wayland presenter
        run: bash wayland/build.sh

      # The plugin DLL itself references BepInEx/UnityEngine (game DLLs, not
      # redistributable) so it cannot be built in CI. The feed server code is
      # compiled STANDALONE by the harness - protocol-identical to production.
      - name: Build feed-server harness (plugin/src/WsServer.cs unchanged)
        run: dotnet build tests/plugin/WsHarness.csproj -c Release -v quiet

      - name: Syntax check
        run: python -m py_compile overlay.py feed_sim.py tests/*.py

      - name: Feed protocol tests (mock servers)
        run: python tests/test_feed_auth.py

      - name: Feed protocol tests (real WsServer.cs harness)
        run: python tests/test_plugin_ws.py

      - name: Feed hardening battery
        run: python tests/test_feed_hardening.py

      - name: Quest objective label battery (plugin/src/ObjectiveLabels.cs)
        run: python tests/test_plugin_labels.py

      - name: Frame geometry & smoothing batteries
        run: |
          python tests/test_frame_rects.py
          python tests/test_smooth.py

      - name: Presenter artifact checksums
        run: |
          sha256sum wayland/wayland_present | tee presenter.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wayland_presenter
          path: |
            wayland/wayland_present
            presenter.sha256

  release_asset:
    name: Attach the plugin build to the release
    needs: tests
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The plugin references BepInEx/UnityEngine (game DLLs, not redistributable),
      # so CI cannot build it - it ships the tracked build instead. That only works if
      # the tracked build really is the tagged version: a tag whose build reports
      # another version has happened before in this project.
      - name: Tracked build must match the tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if strings -a -el plugin/bin/Release/chaossan-questmarkerslinux.dll | grep -Fxq "$ver"; then
            echo "tracked DLL reports $ver"
          else
            echo "::error::plugin/bin/Release/chaossan-questmarkerslinux.dll does not report $ver - bump PluginVersion, rebuild and commit the DLL before tagging"
            exit 1
          fi

      - name: Package the plugin for BepInEx
        run: |
          mkdir -p dist
          cp plugin/bin/Release/chaossan-questmarkerslinux.dll dist/
          cd dist && zip -j "QuestMarkersLinux-plugin-${GITHUB_REF_NAME#v}.zip" chaossan-questmarkerslinux.dll

      - name: Upload the asset to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/QuestMarkersLinux-plugin-${GITHUB_REF_NAME#v}.zip" --clobber
